services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nodecloak
      POSTGRES_DB: nodecloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodecloak"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  api:
    build: .
    env_file: .env
    ports: ["127.0.0.1:8088:8088"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
volumes:
  postgres-data:
