# Include inside the website's server block. The companion realip snippet must
# contain only verified Cloudflare networks from its official ips-v4/ips-v6 lists.
location = /.well-known/oauth-protected-resource/mcp {
    include /etc/nginx/snippets/nodecloak-account-realip.conf;
    proxy_pass http://127.0.0.1:8088;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
}
location = /.well-known/oauth-authorization-server {
    include /etc/nginx/snippets/nodecloak-account-realip.conf;
    proxy_pass http://127.0.0.1:8088;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
}
location = /mcp {
    access_log off;
    client_max_body_size 1m;
    include /etc/nginx/snippets/nodecloak-account-realip.conf;
    proxy_pass http://127.0.0.1:8088;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 45s;
    proxy_buffering off;
}
location ^~ /mcp/ {
    # OAuth URLs carry authorization state and polling credentials.
    access_log off;
    client_max_body_size 1m;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Content-Type-Options;
    add_header Content-Security-Policy $upstream_http_content_security_policy always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    include /etc/nginx/snippets/nodecloak-account-realip.conf;
    proxy_pass http://127.0.0.1:8088;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 45s;
}
location = /admin {
    return 308 /admin/;
}
location ^~ /admin/ {
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Content-Type-Options;
    add_header Content-Security-Policy $upstream_http_content_security_policy always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    include /etc/nginx/snippets/nodecloak-account-realip.conf;
    proxy_pass http://127.0.0.1:8088;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 45s;
}
location = /v1/auth/google/callback {
    access_log off;
    # Use the API's hashed-style policy instead of inheriting the website CSP.
    # Declaring all headers here also preserves the other security headers.
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Content-Type-Options;
    add_header Content-Security-Policy $upstream_http_content_security_policy always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    include /etc/nginx/snippets/nodecloak-account-realip.conf;
    proxy_pass http://127.0.0.1:8088;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 45s;
}
location ^~ /v1/ {
    client_max_body_size 256m;
    include /etc/nginx/snippets/nodecloak-account-realip.conf;
    proxy_pass http://127.0.0.1:8088;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 45s;
}
location = /healthz {
    include /etc/nginx/snippets/nodecloak-account-realip.conf;
    proxy_pass http://127.0.0.1:8088;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 45s;
}
